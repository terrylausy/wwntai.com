<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>订单管理 - wwntAI 配件商城</title>
<meta name="robots" content="noindex">
<script src="Assets/js/tailwindcdn.js"></script>
<style>
    .status-pending{background:#fef3c7;color:#b45309}
    .status-paid{background:#dbeafe;color:#1d4ed8}
    .status-shipped{background:#d1fae5;color:#047857}
    .status-done{background:#e0e7ff;color:#4338ca}
</style>

<body class="bg-gray-50 text-gray-900 min-h-screen antialiased">

<!-- 口令验证 -->
<div id="loginGate" class="min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-sm bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
        <h1 class="text-xl font-bold text-center mb-1">订单管理</h1>
        <p class="text-sm text-gray-500 text-center mb-5">请输入管理口令</p>
        <input id="adminKey" type="password" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-amber-500 mb-3" placeholder="管理口令" onkeydown="if(event.key==='Enter')unlock()">
        <button onclick="unlock()" class="w-full py-3 bg-amber-500 active:bg-amber-600 text-white font-bold rounded-xl transition-colors">进入管理</button>
        <p id="keyErr" class="hidden mt-3 text-center text-sm text-red-500">口令错误，请重试</p>
    </div>
</div>

<!-- 管理面板 -->
<div id="adminPanel" class="hidden">
    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-200">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="font-bold text-lg">订单管理</div>
            <div class="flex items-center gap-2">
                <button onclick="loadOrders()" class="px-3.5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-semibold rounded-lg transition-colors">刷新</button>
                <button onclick="logout()" class="px-3.5 py-2 text-gray-500 hover:text-gray-700 text-sm font-semibold rounded-lg">退出</button>
            </div>
        </div>
    </nav>
    <main class="max-w-3xl mx-auto px-5 py-6">
        <div class="flex flex-wrap gap-2 mb-5 text-xs">
            <span class="px-2.5 py-1 rounded-full bg-gray-100 text-gray-500">全部订单</span>
        </div>
        <div id="loading" class="text-center text-gray-400 text-sm py-8">加载中...</div>
        <div id="orderList" class="space-y-4"></div>
    </main>
</div>

<script>
// ===== CloudBase REST API（与下单页一致）=====
var API_BASE = 'https://wwntai-shop-d6gnt6n6qd274a22c.api.tcloudbasegateway.com/v1/rdb/rest';
var API_KEY = 'eyJhbGciOiJSUzI1NiIsImtpZCI6ImI5MTE4ZDkxLTlmYjAtNGQ5Mi05NzE1LWRhOGYyZWFmMzZhMiJ9.eyJpc3MiOiJodHRwczovL3d3bnRhaS1zaG9wLWQ2Z250Nm42cWQyNzRhMjJjLmFwLXNoYW5naGFpLnRjYi1hcGkudGVuY2VudGNsb3VkYXBpLmNvbSIsInN1YiI6ImFub24iLCJhdWQiOiJ3d250YWktc2hvcC1kNmdudDZuNnFkMjc0YTIyYyIsImV4cCI6NDA5NjQ3OTE0MywiaWF0IjoxNzkyNzk1OTQzLCJub25jZSI6IkRMQXE2UFpGUWpXR21UTXBwbWZwLWciLCJhdF9oYXNoIjoiRExBcTZQWkZRaldHbVRNcHBtZnAtZyIsIm5hbWUiOiJBbm9ueW1vdXMiLCJzY29wZSI6ImFub255bW91cyIsInByb2plY3RfaWQiOiJ3d250YWktc2hvcC1kNmdudDZuNnFkMjc0YTIyYyIsIm1ldGEiOnsicGxhdGZvcm0iOiJQdWJsaXNoYWJsZUtleSJ9LCJyb2xlIjoiYW5vbiIsImlzX2Fub255bW91cyI6dHJ1ZSwiYXBwX21ldGFkYXRhIjp7InByb3ZpZGVyIjoiYW5vbnltb3VzIiwicHJvdmlkZXJzIjpbImFub255bW91cyJdfSwidXNlcl9tZXRhZGF0YSI6eyJuYW1lIjoiQW5vbnltb3VzIn0sInVzZXJfdHlwZSI6IiIsImNsaWVudF90eXBlIjoiY2xpZW50X3VzZXIiLCJpc19zeXN0ZW1fYWRtaW4iOmZhbHNlfQ.2XJTGxhztURj-4ogAvJhrSgxoscbbVKfgLqgcehhfrKVJ-3EY1RTiYhUpLQhsueorwnlaxB6VycLw8SvfTeghxLfjTOrAbKmaEN2zy8AFUhZCMQilzkzXz8i8IZ11hXgPRjfxnzcltLPU5P8GkDNLCdR7hPIcmnueyTJg8xlzOCN0dPK9L1FO7b33VFuRCgimshwWutKFkOkqZ2WQr-5ooKFJq6qTKD0rAZT2i3vD2oYwl5VgcLxEgMe-RyI7EG6haRgDJHIPEB-qzjIiRi95AymklKyc0gZwjCIAshPUDnNgKu98r0Nj7w-7JZrJMZagD5or1Qnsp5nmk1iea3BdQ';
// 管理口令（上线后请改成你自己的）
var ADMIN_KEY = 'wwntai2026';

function apiHeaders(){ return { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' }; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

var statusMap = { pending:['待付款','status-pending'], paid:['已付款','status-paid'], shipped:['已发货','status-shipped'], done:['已完成','status-done'] };

function unlock(){
    if(document.getElementById('adminKey').value === ADMIN_KEY){
        document.getElementById('loginGate').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadOrders();
    } else {
        document.getElementById('keyErr').classList.remove('hidden');
    }
}
function logout(){
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('loginGate').classList.remove('hidden');
    document.getElementById('adminKey').value = '';
}

async function loadOrders(){
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('orderList').innerHTML = '';
    const res = await fetch(API_BASE + '/orders?select=*&order=created_at.desc&limit=100', { headers: apiHeaders() });
    const data = res.ok ? await res.json().catch(function(){return [];}) : [];
    document.getElementById('loading').classList.add('hidden');
    const list = document.getElementById('orderList');
    if(!res.ok){ list.innerHTML = '<p class="text-center text-red-500 text-sm">加载失败：HTTP ' + res.status + '</p>'; return; }
    if(!data || data.length === 0){ list.innerHTML = '<p class="text-center text-gray-400 py-10">暂无订单</p>'; return; }
    list.innerHTML = data.map(o => {
        const [stLabel, stClass] = statusMap[o.status] || ['待付款','status-pending'];
        const t = (o.created_at||'').replace('T',' ').slice(0,19);
        var actions = '';
        if(o.status === 'paid'){
            actions = '<div class="mt-3 pt-3 border-t border-gray-100">'
                + '<div class="flex gap-2 mb-2">'
                +   '<input id="co_'+o.id+'" type="text" placeholder="快递公司(选填)" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-sm">'
                +   '<input id="no_'+o.id+'" type="text" placeholder="快递单号" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-sm">'
                + '</div>'
                + '<button onclick="ship(\''+o.id+'\')" class="w-full py-2.5 bg-emerald-500 active:bg-emerald-600 text-white text-sm font-semibold rounded-lg">标记已发货</button>'
                + '</div>';
        } else if(o.status === 'shipped'){
            actions = '<div class="mt-3 pt-3 border-t border-gray-100">'
                + '<div class="text-sm text-gray-600 mb-2">快递' + (o.tracking_company ? '（'+esc(o.tracking_company)+'）' : '') + '：<span class="font-semibold text-gray-900">' + esc(o.tracking_no||'') + '</span></div>'
                + '<button onclick="complete(\''+o.id+'\')" class="w-full py-2.5 bg-indigo-500 active:bg-indigo-600 text-white text-sm font-semibold rounded-lg">标记交易完成</button>'
                + '</div>';
        }
        return '<div class="bg-white rounded-2xl border border-gray-200 p-5">'
            + '<div class="flex items-center justify-between mb-2">'
            +   '<span class="text-xs text-gray-400">' + esc(o.id) + '</span>'
            +   '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ' + stClass + '">' + stLabel + '</span>'
            + '</div>'
            + '<div class="text-sm font-semibold text-gray-800">' + esc(o.items) + '</div>'
            + '<div class="mt-2 text-sm text-amber-600 font-bold">' + esc(o.total_amount||'') + '</div>'
            + '<div class="mt-2 space-y-1 text-sm text-gray-600">'
            +   '<div>收货：' + esc(o.buyer_name) + '　' + esc(o.buyer_phone) + '</div>'
            +   '<div class="text-xs text-gray-500">' + esc(o.buyer_address) + '</div>'
            +   (o.wx_transaction_id ? '<div class="text-xs text-gray-500">交易订单号：' + esc(o.wx_transaction_id) + '</div>' : '')
            + '</div>'
            + '<div class="mt-2 text-xs text-gray-400">下单：' + esc(t) + '</div>'
            + actions
            + '</div>';
    }).join('');
}

async function ship(id){
    var company = (document.getElementById('co_'+id)||{}).value || '';
    var tracking = (document.getElementById('no_'+id)||{}).value || '';
    if(!tracking.trim()){ alert('请填写快递单号'); return; }
    const res = await fetch(API_BASE + '/orders?id=eq.' + encodeURIComponent(id), {
        method:'PATCH', headers: apiHeaders(),
        body: JSON.stringify({ tracking_no: tracking.trim(), tracking_company: company.trim() || null, status: 'shipped' })
    });
    if(res.ok){ loadOrders(); } else { alert('操作失败：HTTP ' + res.status); }
}

async function complete(id){
    if(!confirm('确认该订单已交易完成？')) return;
    const res = await fetch(API_BASE + '/orders?id=eq.' + encodeURIComponent(id), {
        method:'PATCH', headers: apiHeaders(),
        body: JSON.stringify({ status: 'done' })
    });
    if(res.ok){ loadOrders(); } else { alert('操作失败：HTTP ' + res.status); }
}
</script>
</body>
</html>
