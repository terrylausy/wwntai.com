<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>我的订单 - wwntAI.com 配件商城</title>
<meta name="description" content="wwntAI 配件商城订单查询，输入下单手机号即可查询自己的订单记录。">
<script src="assets/js/tailwindcdn.js"></script>
<link rel="stylesheet" href="Assets/css/fontawesome-all.min.css">
<script>tailwind.config={theme:{extend:{colors:{accent:'#2563eb'},fontFamily:{sans:['Inter','Noto Sans SC','system-ui','sans-serif']}}}}</script>
<style>
    .status-pending{background:#fef3c7;color:#b45309}
    .status-paid{background:#dbeafe;color:#1d4ed8}
    .status-shipped{background:#d1fae5;color:#047857}
    .status-done{background:#e0e7ff;color:#4338ca}
</style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

<!-- 顶部导航 -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2">
            <img src="assets/logos/WwRobot-Logo.png" alt="WW-Robot" class="h-8 w-auto" onerror="this.style.display='none'">
            <span class="text-base font-bold text-gray-900">wwnt<span class="text-accent">AI</span>.com</span>
        </a>
        <a href="parts.html" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors flex items-center gap-1.5"><i class="fas fa-arrow-left"></i>返回配件商城</a>
    </div>
</nav>

<main class="pt-24 pb-16 px-5">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-receipt text-accent"></i>我的订单</h1>
        <p class="text-sm text-gray-500 mt-2">输入下单时填写的手机号，查询订单记录</p>

        <!-- 查询 -->
        <div class="mt-6 bg-white rounded-2xl border border-gray-200 p-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">下单手机号</label>
            <div class="flex gap-2">
                <input id="queryPhone" type="tel" maxlength="11" class="flex-1 rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-amber-500" placeholder="请输入 11 位手机号">
                <button id="queryBtn" onclick="queryOrders()" class="shrink-0 px-5 py-3 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-colors">查询订单</button>
            </div>
            <p id="queryErr" class="hidden mt-2 text-xs text-red-500"></p>
        </div>

        <div id="loading" class="hidden mt-8 text-center text-gray-400 text-sm">查询中...</div>
        <div id="orderList" class="mt-6 space-y-4"></div>
        <div id="empty" class="hidden mt-12 text-center">
            <i class="fas fa-inbox text-5xl text-gray-300"></i>
            <p class="mt-4 text-gray-500">该手机号暂无订单</p>
            <a href="parts.html" class="inline-block mt-4 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors">去选购配件</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  'https://xawygmaszyzcnzwdkvgw.supabase.co',
  'sb_publishable_Oa4JIT4DZS0CYnqPxISLDQ_V1gkh89M'
);

const statusMap = { pending: ['待付款', 'status-pending'], paid: ['已付款', 'status-paid'], shipped: ['已发货', 'status-shipped'], done: ['已完成', 'status-done'] };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function queryOrders() {
  const phone = document.getElementById('queryPhone').value.trim();
  const errEl = document.getElementById('queryErr');
  if (!/^1\d{10}$/.test(phone)) {
    errEl.textContent = '请输入正确的 11 位手机号';
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('orderList').innerHTML = '';
  document.getElementById('empty').classList.add('hidden');
  const btn = document.getElementById('queryBtn');
  btn.disabled = true;
  const { data, error } = await supabase
    .from('orders')
    .select('*')
    .eq('buyer_phone', phone)
    .order('created_at', { ascending: false });
  btn.disabled = false;
  document.getElementById('loading').classList.add('hidden');
  const list = document.getElementById('orderList');
  const empty = document.getElementById('empty');
  if (error) {
    list.innerHTML = '<p class="text-center text-red-500 text-sm">查询失败：' + esc(error.message) + '</p>';
    return;
  }
  if (!data || data.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  list.innerHTML = data.map(o => {
    const [stLabel, stClass] = statusMap[o.status] || ['待付款', 'status-pending'];
    const t = (o.created_at || '').replace('T', ' ').slice(0, 19);
    return '<div class="bg-white rounded-2xl border border-gray-200 p-5">'
      + '<div class="flex items-center justify-between mb-3">'
      +   '<span class="text-xs text-gray-400">订单号 ' + esc(o.id) + '</span>'
      +   '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ' + stClass + '">' + stLabel + '</span>'
      + '</div>'
      + '<div class="text-sm font-semibold text-gray-800">' + esc(o.items) + '</div>'
      + '<div class="mt-3 space-y-1 text-sm text-gray-600">'
      +   '<div>合计：<span class="text-amber-600 font-bold">' + esc(o.total_amount || '-') + '</span></div>'
      +   '<div>收货人：' + esc(o.buyer_name) + '　' + esc(o.buyer_phone) + '</div>'
      +   '<div>地址：' + esc(o.buyer_address) + '</div>'
      +   (o.wx_transaction_id ? '<div>转账单号：' + esc(o.wx_transaction_id) + '</div>' : '')
      +   (o.note ? '<div>备注：' + esc(o.note) + '</div>' : '')
      + '</div>'
      + '<div class="mt-3 text-xs text-gray-400">下单时间：' + esc(t) + '</div>'
      + '</div>';
  }).join('');
}

// 回车查询
document.getElementById('queryPhone').addEventListener('keydown', function(e){
  if (e.key === 'Enter') queryOrders();
});
</script>
</body>
</html>
