<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>我的订单 - wwntAI.com 配件商城</title>
<meta name="description" content="wwntAI 配件商城我的订单，登录后查看自己的订单记录。">
<script src="assets/js/tailwindcdn.js"></script>
<link rel="stylesheet" href="Assets/css/fontawesome-all.min.css">
<script>tailwind.config={theme:{extend:{colors:{accent:'#2563eb'},fontFamily:{sans:['Inter','Noto Sans SC','system-ui','sans-serif']}}}}</script>
<style>
    .status-pending{background:#fef3c7;color:#b45309}
    .status-shipped{background:#d1fae5;color:#047857}
    .status-done{background:#e0e7ff;color:#4338ca}
</style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

<!-- 顶部导航 -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2">
            <img src="assets/logos/WwRobot-Logo.png" alt="WW-Robot" class="h-8 w-auto" onerror="this.style.display='none'">
            <span class="text-base font-bold text-gray-900">wwnt<span class="text-accent">AI</span>.com</span>
        </a>
        <div class="flex items-center gap-2">
            <a href="parts.html" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors">配件商城</a>
            <button id="logoutBtn" onclick="logout()" class="hidden px-3.5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-semibold rounded-lg transition-colors">退出</button>
        </div>
    </div>
</nav>

<main class="pt-24 pb-16 px-5">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-receipt text-accent"></i>我的订单</h1>
        <p id="userLine" class="text-sm text-gray-500 mt-2"></p>

        <div id="loading" class="mt-8 text-center text-gray-400 text-sm">加载中...</div>
        <div id="orderList" class="mt-6 space-y-4"></div>
        <div id="empty" class="hidden mt-12 text-center">
            <i class="fas fa-inbox text-5xl text-gray-300"></i>
            <p class="mt-4 text-gray-500">暂无订单</p>
            <a href="parts.html" class="inline-block mt-4 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors">去选购配件</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
const cloud = WorkBuddyCloud.createWorkBuddyCloud({
  endpoint: 'https://microduck-shop.app.workbuddy.host',
  oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
  publishableKey: 'wbpk_i8mTuyYCDN2UTz9mDvjx0E_gQmBKGcwbLiSUfYltMr2Vu5Qsw9fQz47',
});

const statusMap = { pending: ['待处理', 'status-pending'], shipped: ['已发货', 'status-shipped'], done: ['已完成', 'status-done'] };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init() {
  const { data: session, error } = await cloud.auth.getSession();
  if (error || !session) {
    location.href = 'login.html?redirect=' + encodeURIComponent('orders.html');
    return;
  }
  // 已登录
  document.getElementById('logoutBtn').classList.remove('hidden');
  const name = session.user && session.user.name ? session.user.name : (session.user && session.user.phone ? session.user.phone : '');
  document.getElementById('userLine').textContent = name ? '欢迎，' + name : '';
  await loadOrders();
}

async function loadOrders() {
  const { data, error } = await cloud.database
    .from('orders')
    .select('*')
    .order('created_at', { ascending: false });
  document.getElementById('loading').classList.add('hidden');
  const list = document.getElementById('orderList');
  const empty = document.getElementById('empty');
  if (error) {
    list.innerHTML = '<p class="text-center text-red-500 text-sm">加载失败：' + esc(error.message) + '</p>';
    return;
  }
  if (!data || data.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  list.innerHTML = data.map(o => {
    const [stLabel, stClass] = statusMap[o.status] || ['待处理', 'status-pending'];
    const t = (o.created_at || '').replace('T', ' ').slice(0, 19);
    return '<div class="bg-white rounded-2xl border border-gray-200 p-5">'
      + '<div class="flex items-center justify-between mb-3">'
      +   '<span class="text-xs text-gray-400">订单号 ' + esc(o.id) + '</span>'
      +   '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ' + stClass + '">' + stLabel + '</span>'
      + '</div>'
      + '<div class="text-sm font-semibold text-gray-800">' + esc(o.items) + '</div>'
      + '<div class="mt-3 space-y-1 text-sm text-gray-600">'
      +   '<div>合计：<span class="text-amber-600 font-bold">' + esc(o.total_amount || '-') + '</span></div>'
      +   '<div>收货人：' + esc(o.buyer_name) + '　' + esc(o.buyer_phone) + '</div>'
      +   '<div>地址：' + esc(o.buyer_address) + '</div>'
      +   (o.note ? '<div>备注：' + esc(o.note) + '</div>' : '')
      + '</div>'
      + '<div class="mt-3 text-xs text-gray-400">下单时间：' + esc(t) + '</div>'
      + '</div>';
  }).join('');
}

async function logout() {
  await cloud.auth.signOut();
  location.href = 'login.html';
}

init();
</script>
</body>
</html>
