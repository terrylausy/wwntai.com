<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>登录 / 注册 - wwntAI.com 配件商城</title>
<meta name="description" content="wwntAI 配件商城用户登录，手机号验证码登录后可查看自己的订单。">
<script src="assets/js/tailwindcdn.js"></script>
<link rel="stylesheet" href="Assets/css/fontawesome-all.min.css">
<script>tailwind.config={theme:{extend:{colors:{accent:'#2563eb'},fontFamily:{sans:['Inter','Noto Sans SC','system-ui','sans-serif']}}}}</script>
<style>
    .bg-grid-dark{background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:42px 42px}
</style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

<!-- 顶部导航 -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2">
            <img src="assets/logos/WwRobot-Logo.png" alt="WW-Robot" class="h-8 w-auto" onerror="this.style.display='none'">
            <span class="text-base font-bold text-gray-900">wwnt<span class="text-accent">AI</span>.com</span>
        </a>
        <a href="parts.html" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-lg transition-colors flex items-center gap-1.5"><i class="fas fa-arrow-left"></i>返回配件商城</a>
    </div>
</nav>

<!-- 登录卡片 -->
<main class="pt-24 pb-16 px-5">
    <div class="max-w-sm mx-auto">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-7">
            <h1 class="text-2xl font-bold text-center">登录 / 注册</h1>
            <p class="text-sm text-gray-500 text-center mt-2">手机号验证码登录，登录后可查看订单</p>

            <form id="loginForm" class="mt-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">手机号</label>
                    <input id="phone" type="tel" maxlength="11" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-amber-500" placeholder="请输入 11 位手机号">
                    <p id="phoneErr" class="hidden mt-1 text-xs text-red-500"></p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">验证码</label>
                    <div class="flex gap-2">
                        <input id="code" type="text" maxlength="6" inputmode="numeric" class="flex-1 rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:border-amber-500" placeholder="6 位验证码">
                        <button type="button" id="sendBtn" onclick="sendCode()" class="shrink-0 px-4 py-3 bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold rounded-xl transition-colors disabled:opacity-50">获取验证码</button>
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition-colors">登录 / 注册</button>
            </form>

            <p id="msg" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-semibold"></p>
            <p class="mt-4 text-xs text-gray-400 text-center">未注册的手机号验证后将自动注册</p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
const cloud = WorkBuddyCloud.createWorkBuddyCloud({
  endpoint: 'https://microduck-shop.app.workbuddy.host',
  oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
  publishableKey: 'wbpk_i8mTuyYCDN2UTz9mDvjx0E_gQmBKGcwbLiSUfYltMr2Vu5Qsw9fQz47',
});

let pendingOtp = null;
let countdownTimer = null;

function showMsg(text, ok) {
  const m = document.getElementById('msg');
  m.classList.remove('hidden');
  m.className = 'mt-4 p-3 rounded-xl text-center text-sm font-semibold ' + (ok ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600');
  m.textContent = text;
}

async function sendCode() {
  const phone = document.getElementById('phone').value.trim();
  const errEl = document.getElementById('phoneErr');
  if (!/^1\d{10}$/.test(phone)) {
    errEl.textContent = '请输入正确的 11 位手机号';
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  const { data, error } = await cloud.auth.sendOtp({ phone });
  if (error) {
    btn.disabled = false;
    showMsg(error.message || '验证码发送失败，请稍后重试', false);
    return;
  }
  pendingOtp = { phone, verificationId: data.verificationId, isExistingUser: data.isExistingUser };
  showMsg('验证码已发送，请查收短信', true);
  // 倒计时
  let s = 60;
  countdownTimer = setInterval(() => {
    s--;
    btn.textContent = s + 's 后重发';
    if (s <= 0) {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    }
  }, 1000);
}

document.getElementById('phone').addEventListener('input', () => {
  document.getElementById('phoneErr').classList.add('hidden');
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!pendingOtp || pendingOtp.phone !== phone) {
    showMsg('请先获取验证码', false);
    return;
  }
  if (!code) { showMsg('请输入验证码', false); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  const { data, error } = await cloud.auth.verifyOtp({
    phone: pendingOtp.phone,
    verificationId: pendingOtp.verificationId,
    isExistingUser: pendingOtp.isExistingUser,
    token: code,
  });
  if (error) {
    btn.disabled = false; btn.textContent = '登录 / 注册';
    showMsg(error.message || '验证码错误，请重试', false);
    return;
  }
  pendingOtp = null;
  // 登录成功，跳转来源页
  const redirect = new URLSearchParams(location.search).get('redirect');
  location.href = redirect || 'orders.html';
});
</script>
</body>
</html>
