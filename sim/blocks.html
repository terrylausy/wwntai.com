<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroDuck 图形化编程工作台 · 万物拟态 WWNT Robotics</title>
<meta name="description" content="MicroDuck 双足机器鸭图形化积木编程工作台：拖拽积木生成动作序列，右侧 MuJoCo 物理仿真实时运行，同步输出 Python 代码。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<script src="Assets/js/tailwindcdn.js"></script>
<style>
  :root{
    --bg:#060a0f;
    --panel:#0b1219;
    --panel-2:#0e1720;
    --line:rgba(56,189,248,.16);
    --line-soft:rgba(120,160,190,.12);
    --cyan:#22d3ee;
    --violet:#a78bfa;
    --lime:#a3e635;
    --amber:#fbbf24;
    --rose:#fb7185;
    --ink:#e6f1f8;
    --ink-dim:#8aa1b3;
    --ink-mute:#5b7285;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    background:
      radial-gradient(1100px 520px at 10% -12%, rgba(34,211,238,.10), transparent 62%),
      radial-gradient(900px 480px at 108% 4%, rgba(167,139,250,.10), transparent 58%),
      radial-gradient(700px 400px at 50% 120%, rgba(163,230,53,.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景网格 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(rgba(56,189,248,.035) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(56,189,248,.035) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  }

  /* ============ 顶栏 ============ */
  .topbar{
    position:relative; z-index:3; height:56px; flex:0 0 56px;
    display:flex; align-items:center; gap:16px; padding:0 14px;
    background:linear-gradient(180deg, rgba(12,20,28,.96), rgba(8,13,19,.92));
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px -18px #000;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .brand{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
  .brand-logo{ width:32px; height:32px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; box-shadow:0 0 0 1px rgba(34,211,238,.35), 0 0 18px -6px rgba(34,211,238,.55); }
  .brand-title{ font-size:13.5px; font-weight:800; letter-spacing:.02em; line-height:1.15; }
  .brand-sub{ font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:var(--ink-mute); margin-top:2px; }

  .tabs{ display:flex; padding:3px; border-radius:9px; background:rgba(255,255,255,.04); border:1px solid var(--line-soft); }
  .tab{
    appearance:none; border:0; background:transparent; color:var(--ink-dim);
    font-size:12.5px; font-weight:700; padding:5px 15px; border-radius:7px; cursor:pointer;
    transition:.18s; font-family:inherit;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:#04141a; background:linear-gradient(180deg,#67e8f9,#22d3ee); box-shadow:0 0 18px -4px rgba(34,211,238,.65); }

  .actions{ display:flex; align-items:center; gap:7px; margin-left:auto; }
  .btn{
    appearance:none; display:inline-flex; align-items:center; gap:5px;
    height:30px; padding:0 12px; border-radius:8px; cursor:pointer;
    font-size:12.5px; font-weight:700; font-family:inherit; letter-spacing:.01em;
    color:var(--ink); background:rgba(255,255,255,.045);
    border:1px solid var(--line-soft); transition:.16s; white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,.09); border-color:rgba(34,211,238,.4); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{
    color:#04141a; background:linear-gradient(180deg,#7dd3fc,#22d3ee); border-color:#22d3ee;
    box-shadow:0 0 20px -6px rgba(34,211,238,.9);
  }
  .btn.primary:hover{ background:linear-gradient(180deg,#a5e9ff,#38dcf3); }
  .btn.danger{ color:#fecdd3; border-color:rgba(251,113,133,.4); background:rgba(251,113,133,.09); }
  .btn.danger:hover{ background:rgba(251,113,133,.18); border-color:rgba(251,113,133,.7); }
  .btn.link{ color:var(--ink-dim); text-decoration:none; }
  .sep{ width:1px; height:20px; background:var(--line-soft); }

  .status{
    display:flex; align-items:center; gap:7px; padding-left:14px; margin-left:4px;
    border-left:1px solid var(--line-soft);
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-dim);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 10px var(--amber); }
  .dot.on{ background:var(--lime); box-shadow:0 0 10px var(--lime); animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* ============ 主舞台 ============ */
  .stage{ position:relative; z-index:2; flex:1 1 auto; display:flex; min-height:0; }
  .pane-left{ flex:1 1 57%; min-width:390px; display:flex; flex-direction:column; min-height:0; }
  .pane-right{ flex:1 1 43%; min-width:340px; position:relative; border-left:1px solid var(--line); overflow:hidden; background:#05080c; }

  .pane-head{
    height:30px; flex:0 0 30px; display:flex; align-items:center; gap:10px; padding:0 12px;
    border-bottom:1px solid var(--line-soft);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-mute);
    background:linear-gradient(180deg, rgba(14,23,32,.9), rgba(10,16,23,.7));
  }
  .pane-head .file{ color:var(--ink-dim); letter-spacing:.04em; text-transform:none; font-size:11px; }
  .pane-head .grow{ flex:1; }
  .chip-mini{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--ink-mute);
    border:1px solid var(--line-soft); border-radius:5px; padding:2px 6px;
  }

  .workspace-wrap{ position:relative; flex:1 1 auto; min-height:0; }
  #blocklyDiv{ position:absolute; inset:0; }

  /* 代码视图 */
  .code-view{ position:absolute; inset:0; z-index:8; background:#060b10; display:flex; flex-direction:column; }
  .code-view.hidden{ display:none; }
  .code-head{
    display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line-soft);
    font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:.04em;
  }
  .code-head .fn{ color:var(--cyan); }
  .code-head button{
    margin-left:auto; appearance:none; cursor:pointer; font-family:var(--mono); font-size:10.5px;
    color:var(--ink-dim); background:rgba(255,255,255,.05); border:1px solid var(--line-soft);
    border-radius:6px; padding:3px 9px;
  }
  .code-head button:hover{ color:var(--cyan); border-color:rgba(34,211,238,.45); }
  #codeBody{
    margin:0; padding:14px 16px; overflow:auto; flex:1;
    font-family:var(--mono); font-size:12.5px; line-height:1.85; color:#c7d8e5; white-space:pre; tab-size:4;
  }
  #codeBody .k{ color:#c084fc; }
  #codeBody .s{ color:#86efac; }
  #codeBody .n{ color:#fbbf24; }
  #codeBody .c{ color:#4b6274; font-style:italic; }
  #codeBody .f{ color:#67e8f9; }

  /* 控制台 */
  .console{
    flex:0 0 116px; display:flex; flex-direction:column;
    border-top:1px solid var(--line); background:linear-gradient(180deg, rgba(9,15,21,.96), rgba(6,11,16,.98));
  }
  .console-head{
    height:24px; flex:0 0 24px; display:flex; align-items:center; gap:8px; padding:0 12px;
    font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-mute);
    border-bottom:1px solid rgba(120,160,190,.08);
  }
  .console-head button{
    margin-left:auto; appearance:none; cursor:pointer; background:none; border:0;
    color:var(--ink-mute); font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  }
  .console-head button:hover{ color:var(--cyan); }
  .console-body{ flex:1; overflow:auto; padding:6px 12px 8px; font-family:var(--mono); font-size:11.5px; line-height:1.7; }
  .log-line{ display:flex; gap:8px; white-space:pre-wrap; word-break:break-word; }
  .log-line .t{ color:#3d5265; flex:0 0 auto; }
  .log-line .m{ color:#a9bfd0; }
  .log-line.ok .m{ color:#7dd3fc; }
  .log-line.warn .m{ color:var(--amber); }
  .log-line.err .m{ color:var(--rose); }
  .log-line.dim .m{ color:#5b7285; }

  /* 仿真面板 HUD */
  #simFrame{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#05080c; }
  .hud{ position:absolute; left:12px; top:10px; z-index:5; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .hud .chip{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:#9fd6e6; background:rgba(6,14,20,.72); border:1px solid rgba(34,211,238,.25);
    border-radius:5px; padding:3px 7px; backdrop-filter:blur(6px);
  }
  .hud .chip b{ color:var(--cyan); font-weight:700; }
  .corner{ position:absolute; width:16px; height:16px; border:1px solid rgba(34,211,238,.45); z-index:4; pointer-events:none; }
  .corner.tl{ left:6px; top:6px; border-right:0; border-bottom:0; }
  .corner.tr{ right:6px; top:6px; border-left:0; border-bottom:0; }
  .corner.bl{ left:6px; bottom:6px; border-right:0; border-top:0; }
  .corner.br{ right:6px; bottom:6px; border-left:0; border-top:0; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); z-index:50;
    padding:9px 16px; border-radius:9px; font-size:12.5px; font-weight:600;
    background:rgba(12,22,30,.96); border:1px solid rgba(34,211,238,.4); color:var(--ink);
    box-shadow:0 12px 40px -12px #000; opacity:0; pointer-events:none; transition:.22s;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* Blockly 微调 */
  .blocklyToolboxDiv{ border-right:1px solid var(--line) !important; }
  .blocklyTreeRow{ border-radius:0 8px 8px 0; margin-right:0; }
  .blocklyTreeLabel{ font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif !important; font-size:12px !important; }
  .blocklyFlyoutBackground{ fill:#0d1720 !important; fill-opacity:.97 !important; }
  .blocklyScrollbarHandle{ fill:#1e4a5c !important; }
  /* 运行中积木高亮 */
  .blk-run .blocklyPath{ stroke:#22d3ee !important; stroke-width:2.5px !important; filter:drop-shadow(0 0 9px rgba(34,211,238,.95)); }
  .blk-run .blocklyText{ fill:#ffffff !important; }

  @media (max-width:1080px){
    .brand-text{ display:none; }
    .console{ flex-basis:96px; }
    .actions .btn span.lbl{ display:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="Assets/images/ww-robot-logo.png" alt="万物拟态" class="brand-logo">
    <div class="brand-text">
      <div class="brand-title">万物拟态机器人实验室</div>
      <div class="brand-sub">WWNT Robotics Lab</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-view="blocks">图形化</button>
    <button class="tab" data-view="code">Python</button>
  </div>

  <div class="actions">
    <button class="btn" id="btnNew" title="新建空白工程">新建</button>
    <button class="btn" id="btnOpen" title="打开 .xml 工程">打开</button>
    <button class="btn" id="btnSave" title="保存到浏览器并下载">保存</button>
    <span class="sep"></span>
    <button class="btn primary" id="btnRun">▶ 运行</button>
    <button class="btn danger" id="btnStop" disabled>■ 停止</button>
    <button class="btn" id="btnReset">↺ 复位</button>
    <span class="sep"></span>
    <a class="btn link" href="./index.html">返回仿真</a>
  </div>

  <div class="status" id="engineStatus">
    <span class="dot" id="engineDot"></span><span id="engineText">引擎加载中…</span>
  </div>
</header>

<main class="stage">
  <section class="pane-left">
    <div class="pane-head">
      <span>MicroDuck 积木编程</span>
      <span class="file" id="projName">未命名工程</span>
      <span class="grow"></span>
      <span class="chip-mini" id="autoSaveTip">自动保存已开启</span>
    </div>
    <div class="workspace-wrap">
      <div id="blocklyDiv"></div>
      <div class="code-view hidden" id="codeView">
        <div class="code-head"><span class="fn">microduck_program.py</span><span>· 只读视图</span><button id="btnCopy">复制代码</button></div>
        <pre id="codeBody"></pre>
      </div>
    </div>
    <div class="console">
      <div class="console-head"><span>运行日志</span><button id="btnClearLog">清空</button></div>
      <div class="console-body" id="logBody"></div>
    </div>
  </section>

  <section class="pane-right">
    <iframe id="simFrame" src="./index.html?embed=1" title="MicroDuck 仿真"></iframe>
    <div class="hud">
      <div class="chip"><b>MicroDuck</b> 双足</div>
      <div class="chip">MuJoCo WASM</div>
      <div class="chip" id="hudState">IDLE</div>
    </div>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </section>
</main>

<input type="file" id="fileInput" accept=".xml,.json" hidden>
<div class="toast" id="toast"></div>

<script src="./vendor/blockly/blockly.min.js"></script>
<script src="./vendor/blockly/msg/zh-hans.js"></script>
<script src="./blocks-toolbox.js?v=20261028"></script>
<script src="./blocks.js?v=20261028"></script>
</body>
</html>
